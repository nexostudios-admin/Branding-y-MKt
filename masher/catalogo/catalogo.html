<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Masher · Catálogo de productos</title>
<style>
/* Formato vertical 9:16 (540 × 960 pt), igual que el manual de marca. 1 px CSS = 0,75 pt → hoja de 720 × 1280 px. */
@font-face { font-family: "Masher Cond"; src: url(fonts/DejaVuSansCondensed-Bold.ttf); font-weight: 700; }
@font-face { font-family: "Masher Cond"; src: url(fonts/DejaVuSansCondensed.ttf); font-weight: 400; }
@font-face { font-family: "Masher Text"; src: url(fonts/DejaVuSans.ttf); font-weight: 400; }
@font-face { font-family: "Masher Text"; src: url(fonts/DejaVuSans-Bold.ttf); font-weight: 700; }

:root {
  --azul: #17256B;      /* Azul Masher */
  --negro: #08090B;     /* Negro base */
  --blanco: #FFFFFF;
  --celeste: #9AA8FF;   /* acento de rótulos del manual */
  --gris-osc: #15171D;
  --tinta: #1A1C22;
  --gris: #555A66;
  --linea: #DDE0E7;
  --fondo-suave: #F4F5F8;
  --m: 48px;            /* margen lateral */
}
@page { size: 540pt 960pt; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #888; }
body { font-family: "Masher Text", sans-serif; color: var(--tinta); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
@media print { html, body { background: none; } .hoja { margin: 0 !important; box-shadow: none !important; } }

.hoja { width: 720px; height: 1280px; position: relative; overflow: hidden; background: var(--blanco);
        margin: 20px auto; box-shadow: 0 2px 16px rgba(0,0,0,.25); break-after: page; }
.cond { font-family: "Masher Cond", sans-serif; font-weight: 700; }
.rotulo { font-family: "Masher Cond", sans-serif; font-weight: 700; font-size: 19px; letter-spacing: .08em; text-transform: uppercase; }
.rayas { position: absolute; background: repeating-linear-gradient(to bottom, currentColor 0 9px, transparent 9px 15px); }

/* ---------- Tapa ---------- */
.tapa { background: var(--negro); color: var(--blanco); }
.tapa .barra { position: absolute; left: var(--m); top: 64px; width: 56px; height: 7px; background: var(--celeste); }
.tapa .cab { position: absolute; left: 124px; top: 57px; color: #C9CCD6; }
.tapa .logo { position: absolute; left: var(--m); top: 150px; width: 480px; }
.tapa .rayas { color: var(--azul); right: 0; top: 330px; width: 260px; height: 230px; clip-path: polygon(30% 0, 100% 0, 100% 100%, 0 100%); }
.tapa .eyebrow { position: absolute; left: var(--m); top: 590px; color: var(--celeste); }
.tapa h1 { position: absolute; left: var(--m); top: 628px; font-size: 74px; line-height: 1.02; }
.tapa .bajada { position: absolute; left: var(--m); right: var(--m); top: 960px; font-size: 24px; line-height: 1.45; color: #B9BDC8; }
.tapa .cifras { position: absolute; left: var(--m); right: var(--m); top: 1050px; display: flex; border-top: 1px solid #2A2D36; }
.tapa .cifras div { flex: 1; padding-top: 22px; }
.tapa .cifras b { display: block; font-family: "Masher Cond"; font-size: 54px; line-height: 1; }
.tapa .cifras span { font-size: 19px; color: #9095A3; }
.tapa .pie { position: absolute; left: var(--m); right: var(--m); bottom: 44px; display: flex; justify-content: space-between; font-size: 19px; color: #9095A3; }
.tapa .pie b { color: var(--celeste); font-family: "Masher Cond"; }

/* ---------- Cabecera y pie de páginas interiores ---------- */
.cabecera { position: absolute; left: var(--m); right: var(--m); top: 34px; height: 76px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--azul); }
.cabecera img { width: 250px; margin-bottom: 6px; }
.cabecera .rotulo { color: var(--azul); font-size: 17px; text-align: right; max-width: 300px; line-height: 1.25; }
.pie-int { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--negro); color: #A9ADB8; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--m); font-size: 18px; }
.pie-int .num { font-family: "Masher Cond"; font-weight: 700; color: var(--celeste); font-size: 21px; letter-spacing: .06em; }
.cuerpo { position: absolute; left: var(--m); right: var(--m); top: 130px; bottom: 84px; }

/* ---------- Índice ---------- */
.indice h2, .marcas-pag h2 { font-size: 52px; line-height: 1.04; color: var(--negro); margin-top: 8px; }
.indice .intro { font-size: 21px; color: var(--gris); margin: 12px 0 18px; line-height: 1.45; }
.toc { list-style: none; border-top: 2px solid var(--negro); }
.toc li { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
.toc .n { font-family: "Masher Cond"; font-weight: 700; color: var(--celeste); width: 34px; font-size: 21px; }
.toc .t { flex: 1; }
.toc .t b { display: inline; font-family: "Masher Cond"; font-weight: 700; font-size: 26px; color: var(--negro); line-height: 1.15; }
.toc .t span { font-size: 16px; color: var(--gris); margin-left: 10px; white-space: nowrap; }
.toc .p { font-family: "Masher Cond"; font-weight: 700; color: var(--azul); font-size: 24px; white-space: nowrap; }

/* ---------- Marcas ---------- */
.marcas-pag .intro { font-size: 21px; color: var(--gris); margin: 14px 0 26px; line-height: 1.45; }
.lista-marcas { display: grid; grid-template-columns: 1fr 1fr 1fr; column-gap: 22px; }
.lista-marcas span { font-family: "Masher Cond"; font-weight: 700; font-size: 20px; padding: 8px 0; border-bottom: 1px solid var(--linea); color: var(--negro); }

/* ---------- Bloque de categoría ---------- */
.cat-cab { position: relative; background: var(--azul); color: var(--blanco); padding: 28px 30px 26px; margin-bottom: 6px; overflow: hidden; }
.cat-cab .rotulo { color: var(--celeste); }
.cat-cab h2 { font-size: 46px; line-height: 1.04; margin-top: 8px; position: relative; }
.cat-cab .cuenta { font-size: 19px; color: #C8CDF0; margin-top: 8px; }
.cat-cab .rayas { color: rgba(255,255,255,.09); right: -6px; top: 0; bottom: 0; width: 200px; }
.cat-cont { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--azul); padding: 2px 0 10px; margin-bottom: 2px; }
.cat-cont b { font-family: "Masher Cond"; font-size: 27px; color: var(--azul); }
.cat-cont span { font-size: 16px; color: var(--gris); }

/* ---------- Producto ---------- */
.item { padding: 15px 0 15px; border-bottom: 1px solid var(--linea); }
.item h3 { font-family: "Masher Cond"; font-weight: 700; font-size: 27px; line-height: 1.16; color: var(--negro); }
.item .fila { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 16px; }
.item .marca { font-family: "Masher Cond"; font-weight: 700; font-size: 16px; letter-spacing: .07em; text-transform: uppercase;
               color: var(--azul); border: 2px solid var(--azul); padding: 3px 9px 2px; }
.item .precio { font-family: "Masher Cond"; font-weight: 700; font-size: 38px; line-height: 1; color: var(--azul); white-space: nowrap; }
.item .precio small { font-size: 23px; vertical-align: .5em; margin-right: 2px; }
.item .incluye { font-size: 18px; color: var(--tinta); line-height: 1.4; margin-top: 10px; }
.item .incluye b { color: var(--azul); }
.item p.desc { font-size: 19px; line-height: 1.38; color: var(--gris); margin-top: 7px; }

/* ---------- Contratapa ---------- */
.contra { background: var(--negro); color: var(--blanco); }
.contra .rayas { color: var(--azul); left: 0; right: 0; top: 0; height: 300px; }
.contra .caja { position: absolute; left: var(--m); right: var(--m); top: 380px; }
.contra .caja .rotulo { color: var(--celeste); }
.contra h2 { font-size: 66px; line-height: 1.04; margin: 16px 0 24px; }
.contra .caja p { font-size: 24px; line-height: 1.5; color: #B9BDC8; }
.contra .datos { position: absolute; left: var(--m); right: var(--m); top: 760px; background: var(--gris-osc); padding: 28px 30px; }
.contra .datos b { font-family: "Masher Cond"; font-size: 38px; }
.contra .datos span { display: block; font-size: 19px; color: #9095A3; margin-top: 6px; }
.contra .logo { position: absolute; left: var(--m); top: 960px; width: 340px; }
.contra .legal { position: absolute; left: var(--m); right: var(--m); bottom: 44px; font-size: 16px; line-height: 1.5; color: #8A8F9C; }
</style>
</head>
<body>
<div id="libro"></div>

<template id="t-tapa">
  <section class="hoja tapa">
    <div class="barra"></div>
    <div class="cab rotulo">Masher / Catálogo</div>
    <img class="logo" src="img/masher-logo-blanco.png" alt="Masher máquinas - herramientas">
    <div class="rayas"></div>
    <div class="eyebrow rotulo">Catálogo · Noviembre 2026</div>
    <h1 class="cond">MÁQUINAS Y<br>HERRAMIENTAS<br>PARA EL<br>TRABAJO.</h1>
    <p class="bajada">Eléctricas, de mano, soldadura, medición, seguridad y todo para el taller y la obra.</p>
    <div class="cifras">
      <div><b data-k="productos"></b><span>productos</span></div>
      <div><b data-k="categorias"></b><span>categorías</span></div>
      <div><b data-k="marcas"></b><span>marcas</span></div>
    </div>
    <div class="pie"><span>Ferretería industrial</span><b>@masherrferreteria</b></div>
  </section>
</template>

<template id="t-hoja">
  <section class="hoja">
    <header class="cabecera"><img src="img/masher-logo-azul.png" alt="Masher"><span class="rotulo"></span></header>
    <div class="cuerpo"></div>
    <footer class="pie-int"><span>@masherrferreteria</span><span class="num"></span></footer>
  </section>
</template>

<template id="t-contra">
  <section class="hoja contra">
    <div class="rayas"></div>
    <div class="caja">
      <div class="rotulo">Masher · Ferretería industrial</div>
      <h2 class="cond">¿NO ENCONTRÁS<br>LO QUE BUSCÁS?</h2>
      <p>Escribinos y te ayudamos a elegir la herramienta adecuada. Consultá precios, stock y formas de pago antes de comprar.</p>
    </div>
    <div class="datos"><b>@masherrferreteria</b><span>Instagram · consultas y novedades</span></div>
    <img class="logo" src="img/masher-logo-blanco.png" alt="Masher">
    <p class="legal">Catálogo vigente a noviembre de 2026. Precios en pesos, sujetos a cambio sin previo aviso. Especificaciones a confirmar con el vendedor. Las marcas mencionadas pertenecen a sus respectivos dueños.</p>
  </section>
</template>

<script src="productos.js"></script>
<script>
Promise.all(['700 10px "Masher Cond"','400 10px "Masher Cond"','400 10px "Masher Text"','700 10px "Masher Text"'].map(f => document.fonts.load(f))).then(() => {
  const P = window.PRODUCTOS;
  const libro = document.getElementById('libro');
  const tpl = id => document.getElementById(id).content.firstElementChild.cloneNode(true);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const precio = n => '<small>$</small>' + n.toLocaleString('es-AR');
  const dos = n => String(n).padStart(2, '0');
  // Descripción corta para celular: hasta ~120 caracteres, cortando en palabra.
  const corta = (s, n = 100) => {
    if (!s || s.length <= n) return s;
    const c = s.slice(0, n);
    const coma = c.lastIndexOf(', ');
    let t = coma > 45 ? c.slice(0, coma) : c.slice(0, c.lastIndexOf(' '));
    const sueltas = /\s+(de|del|a|al|y|e|o|u|con|sin|para|en|la|el|los|las|un|una|que|su|sus|por|entre|hasta|desde|mayor|menor|alta|gran|[\d.,/"]+)$/i;
    let prev;
    do { prev = t; t = t.replace(/[\s,;:\-–(]+$/, '').replace(sueltas, ''); } while (t !== prev);
    return t + '.';
  };
  const cats = [];
  for (const p of P) {
    let c = cats[cats.length - 1];
    if (!c || c.nombre !== p.categoria) cats.push(c = { nombre: p.categoria, items: [] });
    c.items.push(p);
  }
  const marcas = [...new Set(P.map(p => p.marca.replace(/\s*\(.*\)$/, '')))].sort((a, b) => a.localeCompare(b, 'es'));

  const tapa = tpl('t-tapa');
  tapa.querySelector('[data-k=productos]').textContent = P.length;
  tapa.querySelector('[data-k=categorias]').textContent = cats.length;
  tapa.querySelector('[data-k=marcas]').textContent = marcas.length;
  libro.appendChild(tapa);

  const hojas = [];
  const nuevaHoja = titulo => {
    const h = tpl('t-hoja');
    h.querySelector('.cabecera .rotulo').textContent = titulo;
    libro.appendChild(h); hojas.push(h);
    return h.querySelector('.cuerpo');
  };
  const desborda = cuerpo => cuerpo.scrollHeight > cuerpo.clientHeight + 1;

  // Índice
  const ind = nuevaHoja('Índice');
  ind.classList.add('indice');
  ind.innerHTML = `<div class="rotulo" style="color:var(--azul)">Contenido</div>
    <h2 class="cond">TODO PARA EL TALLER Y LA OBRA.</h2>
    <p class="intro">${P.length} productos en ${cats.length} categorías, con marca y precio.</p>
    <ol class="toc">${cats.map((c, i) => `<li><span class="n">${dos(i + 1)}</span><span class="t"><b>${esc(c.nombre)}</b><span>${c.items.length} productos</span></span><span class="p" data-cat="${i}"></span></li>`).join('')}</ol>`;

  // Marcas
  const mar = nuevaHoja('Marcas');
  mar.classList.add('marcas-pag');
  mar.innerHTML = `<div class="rotulo" style="color:var(--azul)">Marcas</div>
    <h2 class="cond">${marcas.length} MARCAS EN UN SOLO LUGAR.</h2>
    <p class="intro">Trabajamos con fabricantes reconocidos en herramientas, insumos y equipamiento.</p>
    <div class="lista-marcas">${marcas.map(m => `<span>${esc(m)}</span>`).join('')}</div>`;

  // Categorías
  cats.forEach((c, i) => {
    let cuerpo = nuevaHoja(c.nombre);
    c.pagina = hojas.length + 1;
    cuerpo.insertAdjacentHTML('beforeend', `<div class="cat-cab"><div class="rayas"></div><div class="rotulo">Categoría ${dos(i + 1)}</div><h2 class="cond">${esc(c.nombre.toUpperCase())}</h2><div class="cuenta">${c.items.length} productos</div></div>`);
    for (const p of c.items) {
      const el = document.createElement('article');
      el.className = 'item';
      el.innerHTML = `<h3>${esc(p.producto)}</h3>`
        + `<div class="fila"><span class="marca">${esc(p.marca)}</span><span class="precio">${precio(p.precio)}</span></div>`
        + (p.incluye ? `<div class="incluye"><b>Incluye:</b> ${esc(p.incluye.replace(/^Incluye\s*/i, ''))}</div>` : '')
        + (p.descripcion ? `<p class="desc">${esc(corta(p.descripcion))}</p>` : '');
      cuerpo.appendChild(el);
      if (desborda(cuerpo)) {
        el.remove();
        cuerpo = nuevaHoja(c.nombre);
        cuerpo.insertAdjacentHTML('beforeend', `<div class="cat-cont"><b>${esc(c.nombre)}</b><span>Cat. ${dos(i + 1)} · continuación</span></div>`);
        cuerpo.appendChild(el);
      }
    }
  });

  libro.appendChild(tpl('t-contra'));
  const total = hojas.length + 2;
  hojas.forEach((h, i) => h.querySelector('.pie-int .num').textContent = `${dos(i + 2)} / ${dos(total)}`);
  document.querySelectorAll('[data-cat]').forEach(e => e.textContent = 'pág. ' + dos(cats[+e.dataset.cat].pagina));
  document.body.dataset.listo = '1';
});
</script>
</body>
</html>
