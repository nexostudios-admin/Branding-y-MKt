# Netlify: "Base directory" = masher/web. En cada publicación se vuelve a construir la web leyendo la planilla de Google.
# Si la planilla no se puede leer, se publica con los últimos datos (no se rompe la web).
[build]
  publish = "sitio"
  command = "python3 construir.py"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.13"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
